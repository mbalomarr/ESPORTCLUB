# Publishes the site as-is (no build step) to GitHub Pages on every push to main,
# as an online preview at https://mbalomarr.github.io/ESPORTCLUB/.
# The production site is uploaded manually to MonsterASP (see MONSTERASP_DEPLOYMENT.md).
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Collect site files
        run: mkdir _site && cp -R index.html assets _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - id: deployment
        uses: actions/deploy-pages@v4
